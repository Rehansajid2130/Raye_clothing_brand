      --tracking-neg-6-336: -6.336px;
      --tracking-neg-2-25331: -2.25331px;

    }

    .type-button-11-700 { font-family: var(--font-instrument-sans); font-size: var(--text-11); font-weight: 700; line-height: 1.00; }
    .type-body-11 { font-family: var(--font-instrument-sans); font-size: var(--text-11); font-weight: 700; line-height: 1.05; letter-spacing: var(--tracking-1-3824); }
    .type-small-11-600 { font-family: var(--font-instrument-sans); font-size: var(--text-11); font-weight: 600; line-height: 1.05; }
    .type-body-11-600 { font-family: var(--font-instrument-sans); font-size: var(--text-11); font-weight: 600; line-height: 1.05; letter-spacing: var(--tracking-1-6128); }
    .type-body-11-400 { font-family: var(--font-instrument-sans); font-size: var(--text-11); font-weight: 400; line-height: 1.57; }

    :focus-visible {
      outline: 2px solid var(--color-dark-slate-gray);
      outline-offset: 2px;
      box-shadow: var(--shadow-low);
      border-radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      height: 64px;
      padding: 0 clamp(16px, 4vw, 56px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid var(--ink);
      background: var(--cream);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 32px;
      color: var(--coral);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .checkout-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 40px);
      width: 100%;
      flex: 1;
    }

    .crumbs {
      display: flex;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }
    .crumbs a { text-decoration: none; color: inherit; }

    .checkout-title {
      font-size: clamp(2.4rem, 1.4rem + 3.5vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }
    .checkout-title em {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      color: var(--coral);
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: clamp(24px, 4vw, 48px);
      align-items: start;
    }

    /* Form Styles */
    .checkout-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .form-panel {
      background: #fff;
      border: 1.5px solid var(--ink);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 4px 4px 0 var(--ink);
    }
    .form-panel h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid var(--line);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }
    .field label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-2);
      margin-bottom: 6px;
    }
    .field input, .field select {
      padding: 12px 14px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      background: var(--cream);
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 2px var(--butter);
    }

    /* Radio Options */
    .radios-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .radio-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      padding: 14px 18px;
      background: var(--cream);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .radio-card.active {
      background: #fff;
      border-color: var(--coral);
      box-shadow: 2px 2px 0 var(--coral);
    }
    .radio-card input {
      margin-right: 12px;
    }

    /* Order Summary Aside */
    .summary-card {
      background: #fff;
      border: 1.5px solid var(--ink);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .summary-card h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid var(--line);
    }
    .order-items-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .summary-dl {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .summary-dl div {
      display: flex;
      justify-content: space-between;
    }
    .total-row {
      font-size: 18px;
      font-weight: 800;
      padding-top: 14px;
      border-top: 1.5px solid var(--ink);
      color: var(--ink);
    }
    .total-row span:last-child {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--coral-deep);
    }

    .btn-place-order {
      width: 100%;
      padding: 16px;
      background: var(--coral);
      color: #fff;
      border: 2px solid var(--ink);
      border-radius: 9999px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform 0.15s, background 0.15s;
    }
    .btn-place-order:hover {
      background: var(--coral-deep);
      transform: translateY(-2px);
    }

    @media (max-width: 860px) {
      .checkout-grid { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
    }
  
    /* ==========================================================================
       Page Change Text & Content Fade-In Transitions
       ========================================================================== */
    @keyframes rayeTextFadeIn {
      0% {
        opacity: 0;
        transform: translate3d(0, 24px, 0);
        clip-path: inset(0 0 100% 0);
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
        clip-path: inset(0 0 0 0);
      }
    }

    body {
      opacity: 1;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.page-transitioning {
      opacity: 0 !important;
      transform: translate3d(0, -8px, 0) !important;
    }

    .fade-text,
    .shop-kicker, .shop-title, .shop-subhead, .category-pills,
    .hero-kicker, .hero-title, .hero-desc, .hero-actions,
    .pdp-kicker, .pdp-title, .pdp-price, .pdp-desc,
    .section-kicker, .section-title,
    .about-kicker, .about-title, .about-lead,
    .journal-kicker, .journal-title, .journal-subhead,
    .saved-kicker, .saved-title, .saved-count-lede,
    .cart-title, .checkout-title, .order-title, .account-title, .help-title {
      animation: rayeTextFadeIn 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero-kicker, .shop-kicker, .pdp-kicker, .section-kicker, .about-kicker, .journal-kicker, .saved-kicker {
      animation-delay: 0.10s;
    }
    .hero-title, .shop-title, .pdp-title, .section-title, .about-title, .journal-title, .saved-title, .cart-title, .checkout-title, .order-title, .account-title, .help-title {
      animation-delay: 0.24s;
    }
    .hero-desc, .shop-subhead, .pdp-price, .about-lead, .journal-subhead, .saved-count-lede {
      animation-delay: 0.40s;
    }
    .hero-actions, .category-pills, .pdp-desc, .color-swatches-row {
      animation-delay: 0.56s;
    }

    /* ==========================================================================
       RAYÉ SIGNATURE MASKED WORD/LINE REVEAL ("Line where text comes out")
       ========================================================================== */
    .title .w,
    .hero-headline .w,
    .section-title .w,
    .page-title .w,
    .shop-title .w,
    .about-title .w,
    .journal-title .w,
    .saved-title .w,
    .pdp-title .w,
    .w {
      vertical-align: top;
      margin-bottom: -0.08em;
      padding-bottom: 0.08em;
      display: inline-block;
      overflow: hidden;
      line-height: inherit;
    }

    .title .w__i,
    .hero-headline .w__i,
    .section-title .w__i,
    .page-title .w__i,
    .shop-title .w__i,
    .about-title .w__i,
    .journal-title .w__i,
    .saved-title .w__i,
    .pdp-title .w__i,
    .w__i {
      display: inline-block;
      will-change: transform, opacity;
      transform-origin: 0% 100%;
    }

    @keyframes wordEmergeLine {
      0% {
        transform: translate3d(0, 118%, 0) rotate(4deg);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 1;
      }
    }

    /* Scroll & Page-Change Masked Word Reveal for all Titles (.section-title, [data-title], etc.) */
    [data-title] .w__i,
    .title .w__i,
    .section-title .w__i,
    .shop-title .w__i,
    .about-title .w__i,
    .journal-title .w__i,
    .saved-title .w__i,
    .pdp-title .w__i {
      transform: translate3d(0, 118%, 0) rotate(3.5deg);
      opacity: 0;
      transition: transform 1.05s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease-out;
    }

    [data-title].is-revealed .w__i,
    .title.is-revealed .w__i,
    .section-title.is-revealed .w__i,
    .shop-title.is-revealed .w__i,
    .about-title.is-revealed .w__i,
    .journal-title.is-revealed .w__i,
    .saved-title.is-revealed .w__i,
    .pdp-title.is-revealed .w__i,
    .hero-headline .w__i {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 1;
    }

    /* Subheads, kickers, descriptions reveal with smooth upward glide */
    [data-reveal] {
      opacity: 0;
      transform: translate3d(0, 24px, 0);
      transition: transform 1.0s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease-out;
    }

    [data-reveal].is-revealed {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .script,
    span.script,
    .em {
      font-family: var(--font-serif, "Playfair Display", Georgia, serif) !important;
      font-style: italic !important;
      font-weight: 400 !important;
      font-size: 1.08em;
      letter-spacing: -0.02em;
      padding-right: 0.04em;
    }

</style>
</head>

<body>
  <!-- Sticky Navbar -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">Rayé</a>
    <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--teal);">
      🔒 SSL Encrypted Checkout
    </div>
  </header>

  <!-- Checkout Main -->
  <main class="checkout-wrap">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span>/</span>
      <a href="cart.html">Bag</a>
      <span>/</span>
      <span>Checkout</span>
    </nav>

    <h1 class="checkout-title">Complete your <em>order.</em></h1>

    <div class="checkout-grid">
      <!-- Checkout Form -->
      <form class="checkout-form" id="checkoutForm" onsubmit="handlePlaceOrder(event)">
        <!-- 1. Contact -->
        <div class="form-panel">
          <h2>1. Contact details</h2>
          <div class="field-row">
            <div class="field">
              <label for="cEmail">Email Address</label>
              <input type="email" id="cEmail" required placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="cPhone">Mobile Number (BD)</label>
              <input type="tel" id="cPhone" required placeholder="017XXXXXXXX" pattern="^(?:\+?88)?01[3-9]\d{8}$">
            </div>
          </div>
        </div>

        <!-- 2. Delivery Address -->
        <div class="form-panel">
          <h2>2. Delivery address</h2>
          <div class="field">
            <label for="cName">Full Name</label>
            <input type="text" id="cName" required placeholder="e.g. Hasib Chowdhury">
          </div>
          <div class="field">
            <label for="cAddress">Street Address / House / Road</label>
            <input type="text" id="cAddress" required placeholder="House 42, Road 11, Block D">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="cArea">Area / Thana</label>
              <input type="text" id="cArea" required placeholder="e.g. Banani">
            </div>
            <div class="field">
              <label for="cDistrict">District</label>
              <select id="cDistrict" required onchange="updateDeliveryOptions()">
                <option value="Dhaka" selected>Dhaka</option>
                <option value="Chattogram">Chattogram</option>
                <option value="Cox's Bazar">Cox's Bazar</option>
                <option value="Sylhet">Sylhet</option>
                <option value="Khulna">Khulna</option>
                <option value="Rajshahi">Rajshahi</option>
                <option value="Barishal">Barishal</option>
                <option value="Rangpur">Rangpur</option>
                <option value="Mymensingh">Mymensingh</option>
                <option value="Cumilla">Cumilla</option>
                <option value="Gazipur">Gazipur</option>
                <option value="Narayanganj">Narayanganj</option>
                <option value="Bogura">Bogura</option>
                <option value="Jashore">Jashore</option>
                <option value="Noakhali">Noakhali</option>
                <option value="Feni">Feni</option>
                <option value="Tangail">Tangail</option>
                <option value="Dinajpur">Dinajpur</option>
                <option value="Pabna">Pabna</option>
                <option value="Kushtia">Kushtia</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 3. Delivery Method -->
        <div class="form-panel">
          <h2>3. Delivery method</h2>
          <div class="radios-group" id="deliveryGroup">
            <label class="radio-card active" onclick="selectDelivery('dhaka', 80, this)">
              <div>
                <input type="radio" name="delMethod" checked>
                <strong>Inside Dhaka</strong> · 1–2 working days
              </div>
              <span id="delCostDhaka" style="font-weight: 800; font-family: var(--font-display);">৳80</span>
            </label>

            <label class="radio-card" onclick="selectDelivery('outside', 150, this)">
              <div>
                <input type="radio" name="delMethod">
                <strong>Outside Dhaka</strong> · 3–5 working days
              </div>
              <span id="delCostOutside" style="font-weight: 800; font-family: var(--font-display);">৳150</span>
            </label>

            <label class="radio-card" onclick="selectDelivery('express', 250, this)">
              <div>
                <input type="radio" name="delMethod">
                <strong>Express Delivery (Dhaka)</strong> · Next day before 8 pm
              </div>
              <span style="font-weight: 800; font-family: var(--font-display);">৳250</span>
            </label>
          </div>
        </div>

        <!-- 4. Payment Method -->
        <div class="form-panel">
          <h2>4. Payment method</h2>
          <div class="radios-group">
            <label class="radio-card active" onclick="selectPayment('cod', this)">
              <div>
                <input type="radio" name="payMethod" checked>
                <strong>Cash on delivery (COD)</strong> · Pay when it arrives
              </div>
              <span>💵</span>
            </label>

            <label class="radio-card" onclick="selectPayment('bkash', this)">
              <div>
                <input type="radio" name="payMethod">
                <strong>bKash</strong> · You'll get an automated payment request
              </div>
              <span style="color: #D12053; font-weight: 800;">bKash</span>
            </label>

            <label class="radio-card" onclick="selectPayment('nagad', this)">
              <div>
                <input type="radio" name="payMethod">
                <strong>Nagad</strong> · Instant digital payment
              </div>
              <span style="color: #F7931E; font-weight: 800;">Nagad</span>
            </label>

            <label class="radio-card" onclick="selectPayment('card', this)">
              <div>
                <input type="radio" name="payMethod">
                <strong>Credit or Debit Card</strong> · Visa, Mastercard, Amex
              </div>
              <span>💳</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-place-order">
          Place order now →
        </button>
      </form>

      <!-- Order Summary -->
      <aside>
        <div class="summary-card">
          <h2>Order items</h2>
          <ul class="order-items-list" id="summaryItemList">
            <!-- Populated via JS -->
          </ul>

          <dl class="summary-dl">
            <div>
              <dt>Subtotal</dt>
              <dd id="subtotalVal">৳0</dd>
            </div>
            <div id="discountRow" style="display: none; color: var(--teal);">
              <dt>Discount</dt>
              <dd id="discountVal">−৳0</dd>
            </div>
            <div>
              <dt>Delivery</dt>
              <dd id="shippingVal">৳80</dd>
            </div>
            <div class="total-row">
              <dt>Total payable</dt>
              <dd id="totalVal">৳0</dd>
            </div>
          </dl>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem('raye_cart') || '[]');
    const activePromo = localStorage.getItem('raye_promo') || null;

    let selectedDeliveryFee = 80;
    let selectedDeliveryName = 'Inside Dhaka (1-2 days)';
    let selectedPayment = 'Cash on delivery';

    function initCheckout() {
      if (cart.length === 0) {
        alert('Your bag is empty. Please add items before checking out.');
        location.href = 'shop.html';
        return;
      }

      const list = document.getElementById('summaryItemList');
      list.innerHTML = cart.map(item => `
        <li class="order-item-row">
          <span>${item.name} (${item.size || 'M'}) × ${item.qty || 1}</span>
          <span style="font-family: var(--font-display);">৳${(item.price * (item.qty || 1)).toLocaleString('en-IN')}</span>
        </li>
      `).join('');

      calculateTotals();
    }

    function calculateTotals() {
      const subtotal = cart.reduce((acc, item) => acc + (item.price * (item.qty || 1)), 0);
      let shipping = subtotal >= 3000 ? 0 : selectedDeliveryFee;

      let discount = 0;
      if (activePromo === 'RAYE10') discount = Math.round(subtotal * 0.1);
      if (activePromo === 'SALTAIR') shipping = 0;

      const total = Math.max(0, subtotal - discount + shipping);

      document.getElementById('subtotalVal').textContent = '৳' + subtotal.toLocaleString('en-IN');
      document.getElementById('shippingVal').textContent = shipping === 0 ? 'Free' : '৳' + shipping;

      if (discount > 0) {
        document.getElementById('discountRow').style.display = 'flex';
        document.getElementById('discountVal').textContent = '−৳' + discount.toLocaleString('en-IN');
      }

      document.getElementById('totalVal').textContent = '৳' + total.toLocaleString('en-IN');
    }

    function selectDelivery(type, fee, el) {
      document.querySelectorAll('#deliveryGroup .radio-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      el.querySelector('input').checked = true;
      selectedDeliveryFee = fee;
      selectedDeliveryName = type === 'dhaka' ? 'Inside Dhaka' : type === 'outside' ? 'Outside Dhaka' : 'Express Dhaka';
      calculateTotals();
    }

    function selectPayment(type, el) {
      document.querySelectorAll('.form-panel:last-of-type .radio-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      el.querySelector('input').checked = true;
      selectedPayment = type.toUpperCase();
    }

    function updateDeliveryOptions() {
      const dist = document.getElementById('cDistrict').value;
      const isDhaka = dist === 'Dhaka';
      // Auto-toggle appropriate default
      if (!isDhaka) {
        selectDelivery('outside', 150, document.querySelectorAll('#deliveryGroup .radio-card')[1]);
      } else {
        selectDelivery('dhaka', 80, document.querySelectorAll('#deliveryGroup .radio-card')[0]);
      }
    }

    function handlePlaceOrder(e) {
      e.preventDefault();
      const orderId = 'RY-' + Math.floor(1000 + Math.random() * 9000);
      const subtotal = cart.reduce((acc, item) => acc + (item.price * (item.qty || 1)), 0);
      const discount = activePromo === 'RAYE10' ? Math.round(subtotal * 0.1) : 0;
      const shipping = subtotal >= 3000 ? 0 : selectedDeliveryFee;
      const total = subtotal - discount + shipping;

      const orderData = {
        id: orderId,
        date: new Date().toISOString(),
        name: document.getElementById('cName').value,
        email: document.getElementById('cEmail').value,
        phone: document.getElementById('cPhone').value,
        address: document.getElementById('cAddress').value + ', ' + document.getElementById('cArea').value + ', ' + document.getElementById('cDistrict').value,
        deliveryMethod: selectedDeliveryName,
        paymentMethod: selectedPayment,
        items: [...cart],
        subtotal: subtotal,
        discount: discount,
        shipping: shipping,
        total: total
      };

      // Save order and clear bag
      const orders = JSON.parse(localStorage.getItem('raye_orders') || '[]');
      orders.unshift(orderData);
      localStorage.setItem('raye_orders', JSON.stringify(orders));
      localStorage.removeItem('raye_cart');

      // Redirect to confirmation page
      location.href = `order.html?id=${orderId}`;
    }

    initCheckout();
  </script>

  <script>
  // Page Transition & Smooth Text Fade-In on Page Change
  (function() {
    
        // RAYÉ SIGNATURE MASKED TEXT REVEAL ("Line where text comes out")
    function initMaskedTextReveal() {
      // 1. Tag-safe word wrapper that never corrupts HTML elements or attributes
      var targets = document.querySelectorAll('[data-title]');
      targets.forEach(function(el) {
        if (!el.querySelector('.w') && el.textContent.trim().length > 0) {
          el.innerHTML = el.innerHTML.replace(/(<[^>]+>)|([^\s<]+)/g, function(match, tag, word) {
            if (tag) return tag; // preserve existing HTML tags and styles intact
            return '<span class="w"><span class="w__i">' + word + '</span></span>';
          });
        }
      });

      // 2. Set staggered transition delay on each word
      document.querySelectorAll('[data-title], .title, .hero-headline').forEach(function(title) {
        var words = title.querySelectorAll('.w__i');
        words.forEach(function(w, i) {
          w.style.transitionDelay = (i * 0.065) + 's';
        });
      });

      // 3. Reveal elements in viewport via IntersectionObserver
      if ('IntersectionObserver' in window) {
        var revealObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-revealed');
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

        document.querySelectorAll('[data-title], .title, [data-reveal]').forEach(function(el) {
          if (!el.closest('.hero-container') && !el.closest('.hero-left')) {
            revealObserver.observe(el);
          } else {
            el.classList.add('is-revealed');
          }
        });
      } else {
        document.querySelectorAll('[data-title], .title, [data-reveal]').forEach(function(el) {
          el.classList.add('is-revealed');
        });
      }
    }

    function initTransitions() {
      initMaskedTextReveal();
      document.body.classList.remove('page-transitioning');
      document.querySelectorAll('a[href]').forEach(function(link) {
        link.addEventListener('click', function(e) {
          var href = link.getAttribute('href');
          if (
            href &&
            !href.startsWith('#') &&
            !href.startsWith('mailto:') &&
            !href.startsWith('tel:') &&
            !href.startsWith('javascript:') &&
            !href.startsWith('http') &&
            !link.hasAttribute('target') &&
            !e.ctrlKey && !e.metaKey && !e.shiftKey
          ) {
            e.preventDefault();
            document.body.classList.add('page-transitioning');
            setTimeout(function() {
              window.location.href = href;
            }, 280);
          }
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTransitions);
    } else {
      initTransitions();
    }

    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        document.body.classList.remove('page-transitioning');
      }
    });
  })();
  </script>
</body>
